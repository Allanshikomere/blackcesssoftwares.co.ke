<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1E1017" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="25%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#33101C"/>
      <stop offset="75%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#FF758F"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Ring -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGlow)"/>
  <circle cx="50" cy="50" r="46" stroke="url(#metalRim)" stroke-width="3" filter="url(#glowEffect)"/>
  <circle cx="50" cy="50" r="41" stroke="#E11D48" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  
  <!-- Stylized "B" & "S" overlapping emblem -->
  <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="-1">
    <!-- Drop Shadow / Red Aura for BS -->
    <text x="28" y="62" fill="#E11D48" opacity="0.8" filter="url(#glowEffect)" text-anchor="middle">B</text>
    <text x="68" y="64" fill="#FF4D6D" opacity="0.8" filter="url(#glowEffect)" text-anchor="middle">S</text>
    
    <!-- Main BS Text with high metallic gradient -->
    <text x="32" y="62" fill="url(#textGrad)" text-anchor="middle" font-style="italic">B</text>
    <text x="66" y="64" fill="url(#textGrad)" text-anchor="middle" font-style="italic">S</text>
  </g>
  
  <!-- Subtle High-tech Circuit Notch -->
  <path d="M 50 4 L 50 14" stroke="#FF4D6D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 50 86 L 50 96" stroke="#FF4D6D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 4 50 L 14 50" stroke="#FF4D6D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 86 50 L 96 50" stroke="#FF4D6D" stroke-width="2.5" stroke-linecap="round"/>
</svg>
